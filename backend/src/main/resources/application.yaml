spring:
  application:
    name: backend
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/cashcard_family
    username: cashcard
    password: cashcard
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  jwt:
    secret: ${JWT_SECRET:cle-secrete-de-developpement-tres-longue-pour-hs256-0123456789-abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.security: DEBUG