<main class="auth-page">
  <div class="board auth-board">
    <h1>Créer un compte</h1>
    <p class="subtitle">Rejoignez CashCard Family</p>

    @if (error()) {
      <div class="error-banner">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()" class="form">
      <label>
        Prénom
        <input
          type="text"
          name="firstName"
          [(ngModel)]="form.firstName"
          placeholder="Jean"
          required
        />
      </label>

      <label>
        Nom
        <input
          type="text"
          name="lastName"
          [(ngModel)]="form.lastName"
          placeholder="Dupont"
          required
        />
      </label>

      <label>
        Email
        <input
          type="email"
          name="email"
          [(ngModel)]="form.email"
          placeholder="jean@dupont.com"
          required
        />
      </label>

      <label>
        Mot de passe
        <input
          type="password"
          name="password"
          [(ngModel)]="form.password"
          placeholder="8 caractères minimum"
          required
          minlength="8"
        />
      </label>

      <button type="submit" class="primary-btn submit-btn" [disabled]="loading()">
        @if (loading()) {
          Création...
        } @else {
          Créer mon compte
        }
      </button>
    </form>

    <p class="footer-text">
      Déjà un compte ?
      <a routerLink="/login">Se connecter</a>
    </p>
  </div>
</main>
